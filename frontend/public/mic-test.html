<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mic Capture Diagnostic</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 24px; }
    button { padding: 12px 24px; font-size: 16px; margin: 8px; cursor: pointer; }
    #log { white-space: pre; margin-top: 16px; max-height: 500px; overflow-y: auto; }
    .warn  { color: #f80; }
    .error { color: #f44; }
    .ok    { color: #0f0; }
    #meter { width: 100%; height: 24px; background: #222; margin: 8px 0; }
    #bar   { height: 100%; width: 0%; background: #0f0; transition: width 0.1s; }
  </style>
</head>
<body>
  <h2>🎙️ Microphone Capture Diagnostic</h2>
  <p>This page tests raw microphone capture OUTSIDE of React/WebSocket.</p>
  <p>If this shows non-zero values → your mic works, the React code is broken.<br>
     If this also shows zeros → Windows Privacy or OS settings are blocking the mic.</p>
  <div id="meter"><div id="bar"></div></div>
  <div id="status">Click START to begin</div>
  <button onclick="start()">START TEST</button>
  <button onclick="stop()">STOP</button>
  <div id="log"></div>

  <script>
    let audioCtx, processor, stream, running = false;
    const log = document.getElementById('log');
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');

    function print(msg, cls = '') {
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      log.prepend(line);
    }

    async function start() {
      if (running) return;
      log.innerHTML = '';
      print('Enumerating devices...');

      try {
        // First request permission
        const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        tempStream.getTracks().forEach(t => t.stop());

        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs = devices.filter(d => d.kind === 'audioinput');
        print(`Found ${inputs.length} audio input(s):`);
        inputs.forEach((d, i) => print(`  [${i}] "${d.label}" id=${d.deviceId.slice(0,8)}...`));

        // Pick non-default, non-communications, non-virtual device
        const SKIP = /virtual|loopback|cable|voicemeeter|stereo mix|communications/i;
        const best = inputs.find(d =>
          d.deviceId !== 'default' && d.deviceId !== 'communications' && !SKIP.test(d.label)
        );
        print(`Selected: "${best?.label ?? 'OS default (fallback)'}"`, best ? 'ok' : 'warn');

        // Get stream
        stream = await navigator.mediaDevices.getUserMedia({
          audio: best ? { deviceId: { exact: best.deviceId } } : true
        });

        const track = stream.getAudioTracks()[0];
        print(`Track: "${track.label}"`);
        print(`  enabled=${track.enabled}  muted=${track.muted}  readyState=${track.readyState}`,
          track.enabled && !track.muted && track.readyState === 'live' ? 'ok' : 'error');

        // Create AudioContext at NATIVE rate (no forced 16000!)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();
        print(`AudioContext: state=${audioCtx.state}  sampleRate=${audioCtx.sampleRate}Hz`,
          audioCtx.state === 'running' ? 'ok' : 'error');

        // Build pipeline
        const source = audioCtx.createMediaStreamSource(stream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);
        source.connect(processor);
        processor.connect(audioCtx.destination);
        print('Pipeline connected: source → processor → destination', 'ok');

        let callbackN = 0;
        processor.onaudioprocess = (e) => {
          const input = e.inputBuffer.getChannelData(0);
          let peak = 0, sumSq = 0;
          for (let i = 0; i < input.length; i++) {
            const v = Math.abs(input[i]);
            if (v > peak) peak = v;
            sumSq += input[i] * input[i];
          }
          const rms = Math.sqrt(sumSq / input.length);
          const peakPct = Math.min(100, peak * 100 * 5); // ×5 for visibility
          bar.style.width = peakPct + '%';
          bar.style.background = peak === 0 ? '#f44' : peak < 0.01 ? '#f80' : '#0f0';
          status.textContent = `peak=${peak.toFixed(6)}  rms=${rms.toFixed(6)}  ${peak === 0 ? '❌ SILENCE' : '✅ SIGNAL'}`;

          if (callbackN++ < 10 || peak > 0) {
            const cls = peak === 0 ? 'error' : peak < 0.005 ? 'warn' : 'ok';
            print(`Callback #${callbackN} | peak=${peak.toFixed(6)} rms=${rms.toFixed(6)} | first3=[${Array.from(input.slice(0,3)).map(v=>v.toFixed(4)).join(', ')}]`, cls);
          }
        };

        running = true;
        print('=== Recording started — speak into your mic ===', 'ok');

      } catch (err) {
        print('ERROR: ' + err.message, 'error');
        console.error(err);
      }
    }

    function stop() {
      running = false;
      try { processor?.disconnect(); } catch {}
      try { audioCtx?.close(); } catch {}
      stream?.getTracks().forEach(t => t.stop());
      bar.style.width = '0%';
      status.textContent = 'Stopped';
      print('--- Stopped ---');
    }
  </script>
</body>
</html>
